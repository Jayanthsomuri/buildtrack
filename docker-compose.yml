# BuildTrack - the "site plan" that starts every service together.
#   Start:  docker compose up -d --build
#   Stop:   docker compose down          (data is kept)
#   Wipe:   docker compose down -v       (also deletes all database data)
#
#   Web app:                    http://localhost:3000
#   Kafka UI (see the events):  http://localhost:8080

name: buildtrack

services:
  # ---------- Database: one PostgreSQL server, one database per service ----------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin              # admin login - local development only
      POSTGRES_PASSWORD: admin_pass
    ports:
      - "5432:5432"                     # so you can open it with a database tool from your PC
    volumes:
      - postgres-data:/var/lib/postgresql/data      # the "storage unit": data survives restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro    # creates projects_db and crews_db on first start
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- Kafka: the "bulletin board" services use to announce events ----------
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"                     # for tools on your PC (inside Docker, services use kafka:9092)
    environment:
      # Single-server setup (KRaft mode - no ZooKeeper needed). Fine for learning, not for production.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw   # any fixed ID in Kafka's format (base64 UUID)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two "doors": INTERNAL for containers (kafka:9092), EXTERNAL for your PC (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # With only one server, every topic can have only one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3           # new topics get 3 partitions ("columns")
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # A web page to look at topics and events: http://localhost:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: buildtrack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Services ----------
  project-service:
    build: ./project-service            # use the Dockerfile in this folder
    ports:
      - "3001:3001"                     # "your PC port : container port"
    environment:
      PORT: 3001
      # Only the key to projects_db - this service can't open crews_db.
      DATABASE_URL: postgres://project_user:project_pass@postgres:5432/projects_db
      KAFKA_BROKERS: kafka:9092
      # Note: no CREW_SERVICE_URL any more - Project Service doesn't know Crew Service exists.
    depends_on:
      postgres:
        condition: service_healthy      # wait until the database is ready
      kafka:
        condition: service_healthy      # wait until the bulletin board is ready
    healthcheck:                        # Docker asks /health every 10s to know the service is alive
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped             # if it crashes, Docker starts it again

  crew-service:
    build: ./crew-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      # Only the key to crews_db - this service can't open projects_db.
      DATABASE_URL: postgres://crew_user:crew_pass@postgres:5432/crews_db
      KAFKA_BROKERS: kafka:9092
      # Still needed: when assigning a worker we must check the project exists right now.
      PROJECT_SERVICE_URL: http://project-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------- Web front end: http://localhost:3000 ----------
  # The browser talks ONLY to this app. It calls the services from its server side over the Docker
  # network, so the services need no CORS and the browser never sees their addresses.
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      PROJECT_SERVICE_URL: http://project-service:3001
      CREW_SERVICE_URL: http://crew-service:3002
    depends_on:
      project-service:
        condition: service_healthy
      crew-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
